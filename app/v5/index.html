<!doctype html>
<!-- Owner: 06 · App developer (Darius) -->
<!-- The page (layout v5, 15 Nov 2026): toolbar, map, timeline, and a menu that opens when the map is used.
     It reads products/<site>/ only. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Dancing on Salt · Ocnele Mari</title>
  <meta name="description" content="How the ground moves above the salt-brine fields of Ocnele Mari, Romania, seen by two radar satellites, NISAR and Sentinel-1.">
  <link rel="icon" href="../favicon.png">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@6.15.0/dist/maplibre-gl.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="toolbar">
    <div class="name">Dancing on Salt</div>
    <div class="settings">
      <div class="setting down" id="set-sat">
        <button type="button" class="set-btn" aria-haspopup="true">Satellite</button>
        <div class="opts" role="menu" aria-label="Satellite">
          <button type="button" role="menuitemradio" data-sat="nisar">NISAR</button>
          <button type="button" role="menuitemradio" data-sat="s1">Sentinel-1</button>
        </div>
      </div>
    </div>
  </header>

  <main id="map" aria-label="Map of Ocnele Mari"></main>

  <aside id="menu" hidden aria-label="Selected place">
    <section id="graph"></section>
    <section id="legend"></section>
  </aside>

  <footer id="timeline">
    <div id="tl-bar">
      <div class="setting up" id="set-unit">
        <button type="button" class="set-btn" aria-haspopup="true">Time unit</button>
        <div class="opts" role="menu" aria-label="Time unit">
          <button type="button" role="menuitemradio" data-unit="years">Years</button>
          <button type="button" role="menuitemradio" data-unit="months">Months</button>
        </div>
      </div>
    </div>
    <div id="tl-line"><svg id="tl-svg" role="slider" tabindex="0" aria-label="Time period"></svg></div>
  </footer>

  <script type="module" src="main.js"></script>
</body>
</html>
